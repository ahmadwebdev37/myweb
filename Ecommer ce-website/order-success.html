<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Successful</title>

    <link rel="stylesheet" href="css/style.css">

    <style>

        body{
            margin:0;
            font-family:Arial, sans-serif;
            background:#f4f4f4;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .success-box{
            background:white;
            padding:40px;
            width:400px;
            text-align:center;
            border-radius:12px;
            box-shadow:0 0 15px rgba(0,0,0,.2);
        }

        .success-box h1{
            color:#00b894;
            margin-bottom:15px;
        }

        .success-box p{
            font-size:18px;
            color:#555;
            margin-bottom:25px;
        }

        .btn{
            display:inline-block;
            padding:12px 25px;
            background:#111827;
            color:white;
            text-decoration:none;
            border-radius:6px;
            transition:.3s;
        }

        .btn:hover{
            background:#00bcd4;
        }

    </style>

</head>

<body>

    <div class="success-box">

        <h1>🎉 Order Placed Successfully!</h1>

        <p>
            Thank you for shopping with ShopEasy.
            Your order has been received successfully.
        </p>

        <a href="index.html" class="btn">
            Back to Home
        </a>

    </div>

</body>

</html>
