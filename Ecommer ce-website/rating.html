<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Rating - ShopEasy</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header>

    <div class="logo">
        <h2>ShopEasy</h2>
    </div>

    <nav>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="profile.html">Profile</a></li>
            <li><a href="orders.html">Orders</a></li>
            <li><a href="cart.html">Cart</a></li>
        </ul>
    </nav>

</header>

<section class="rating-page">

    <h1>⭐ Product Rating & Reviews</h1>

    <div class="rating-box">

        <h2>Wireless Headphones</h2>

        <img src="images/product1.jpg" alt="Product">

        <h3>Give Your Rating</h3>

        <div class="stars">

            <span data-star="1">⭐</span>
            <span data-star="2">⭐</span>
            <span data-star="3">⭐</span>
            <span data-star="4">⭐</span>
            <span data-star="5">⭐</span>

        </div>

        <textarea
            id="reviewText"
            placeholder="Write your review...">
        </textarea>

        <button id="submitReview" class="btn">
            Submit Review
        </button>

    </div>

</section>

<section class="reviews-section">

    <h2>Customer Reviews</h2>

    <div id="reviewsList"></div>

</section>

<footer>

<p>© 2026 ShopEasy. All Rights Reserved.</p>

</footer>

<script src="js/script.js"></script>

</body>
</html>
