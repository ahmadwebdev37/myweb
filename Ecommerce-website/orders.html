<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="View your previous ShopEasy orders and order history."
    >

    <title>Order History - ShopEasy</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <div class="logo">
            <a href="index.html" aria-label="ShopEasy Home">
                <h2>ShopEasy</h2>
            </a>
        </div>

        <nav aria-label="Main navigation">
            <ul>
                <li>
                    <a href="index.html">Home</a>
                </li>

                <li>
                    <a href="wishlist.html">Wishlist</a>
                </li>

                <li>
                    <a href="cart.html">Cart</a>
                </li>

                <li>
                    <a href="profile.html">Profile</a>
                </li>

                <li>
                    <a href="orders.html" aria-current="page">Orders</a>
                </li>
            </ul>
        </nav>

        <div class="icons">
            <a href="wishlist.html">
                ❤️ Wishlist
                (<span id="wishlist-count">0</span>)
            </a>

            <a href="cart.html">
                🛒 Cart
                (<span id="cart-count">0</span>)
            </a>

            <a href="login.html" id="userName">
                👤 Login
            </a>

            <a
                href="#"
                id="logoutBtn"
                style="display: none;"
            >
                🚪 Logout
            </a>
        </div>
    </header>

    <main>
        <section
            class="orders-section"
            aria-labelledby="orders-title"
        >

            <div class="orders-container">

                <h1 id="orders-title">
                    📦 My Order History
                </h1>

                <p>
                    Your previous orders will appear below.
                </p>

                <div id="ordersList">
                    <p id="noOrders">
                        You have not placed any orders yet.
                    </p>
                </div>

                <a
                    href="index.html"
                    class="btn"
                >
                    Continue Shopping
                </a>

            </div>
        </section>
    </main>

    <footer>
        <p>
            © 2026 ShopEasy. All Rights Reserved.
        </p>
    </footer>

    <script src="js/script.js"></script>

</body>

</html>
