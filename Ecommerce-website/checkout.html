<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="Complete your ShopEasy order securely."
    >

    <title>Checkout - ShopEasy</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <main>
        <section
            class="checkout-container"
            aria-labelledby="checkout-title"
        >

            <h1 id="checkout-title">
                Checkout
            </h1>

            <form action="order-success.html">

                <label for="fullName">
                    Full Name
                </label>

                <input
                    type="text"
                    id="fullName"
                    name="fullName"
                    placeholder="Full Name"
                    autocomplete="name"
                    required
                >

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Email Address"
                    autocomplete="email"
                    required
                >

                <label for="phone">
                    Phone Number
                </label>

                <input
                    type="tel"
                    id="phone"
                    name="phone"
                    placeholder="Phone Number"
                    autocomplete="tel"
                    required
                >

                <label for="address">
                    Address
                </label>

                <input
                    type="text"
                    id="address"
                    name="address"
                    placeholder="Address"
                    autocomplete="street-address"
                    required
                >

                <label for="city">
                    City
                </label>

                <input
                    type="text"
                    id="city"
                    name="city"
                    placeholder="City"
                    autocomplete="address-level2"
                    required
                >

                <label for="country">
                    Country
                </label>

                <input
                    type="text"
                    id="country"
                    name="country"
                    placeholder="Country"
                    autocomplete="country-name"
                    required
                >

                <label for="zipCode">
                    ZIP Code
                </label>

                <input
                    type="text"
                    id="zipCode"
                    name="zipCode"
                    placeholder="ZIP Code"
                    autocomplete="postal-code"
                    required
                >

                <label for="paymentMethod">
                    Payment Method
                </label>

                <select
                    id="paymentMethod"
                    name="paymentMethod"
                    required
                >
                    <option value="">
                        Select Payment Method
                    </option>

                    <option value="cash-on-delivery">
                        Cash on Delivery
                    </option>

                    <option value="credit-card">
                        Credit Card
                    </option>

                    <option value="debit-card">
                        Debit Card
                    </option>

                    <option value="paypal">
                        PayPal
                    </option>
                </select>

                <button type="submit">
                    Place Order
                </button>

            </form>

        </section>
    </main>

</body>

</html>
