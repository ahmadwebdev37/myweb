<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="View and manage your ShopEasy profile information."
    >

    <title>My Profile - ShopEasy</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <div class="logo">
            <a href="index.html" aria-label="ShopEasy Home">
                <h2>ShopEasy</h2>
            </a>
        </div>

        <nav aria-label="Main navigation">
            <ul>
                <li>
                    <a href="index.html">Home</a>
                </li>

                <li>
                    <a href="wishlist.html">Wishlist</a>
                </li>

                <li>
                    <a href="cart.html">Cart</a>
                </li>

                <li>
                    <a
                        href="profile.html"
                        aria-current="page"
                    >
                        Profile
                    </a>
                </li>
            </ul>
        </nav>

        <div class="icons">
            <a href="wishlist.html">
                ❤️ Wishlist
                (<span id="wishlist-count">0</span>)
            </a>

            <a href="cart.html">
                🛒 Cart
                (<span id="cart-count">0</span>)
            </a>

            <a href="login.html" id="userName">
                👤 Login
            </a>

            <a
                href="#"
                id="logoutBtn"
                style="display: none;"
            >
                🚪 Logout
            </a>
        </div>
    </header>

    <main>
        <section
            class="profile-section"
            aria-labelledby="profile-title"
        >

            <div class="profile-card">

                <h1 id="profile-title">
                    👤 My Profile
                </h1>

                <div class="profile-info">

                    <div class="profile-item">
                        <h3>Full Name</h3>

                        <p id="profileName">
                            Loading...
                        </p>
                    </div>

                    <div class="profile-item">
                        <h3>Email Address</h3>

                        <p id="profileEmail">
                            Loading...
                        </p>
                    </div>

                    <div class="profile-item">
                        <h3>Account Status</h3>

                        <p style="color: green;">
                            ✅ Active
                        </p>
                    </div>

                </div>

                <a
                    href="index.html"
                    class="btn"
                >
                    Back To Home
                </a>

            </div>
        </section>
    </main>

    <footer>
        <p>
            © 2026 ShopEasy. All Rights Reserved.
        </p>
    </footer>

    <script src="js/script.js"></script>

</body>

</html>
