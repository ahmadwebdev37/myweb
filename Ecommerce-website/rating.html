<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="Rate ShopEasy products and share your review."
    >

    <title>Product Rating - ShopEasy</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <div class="logo">
            <a href="index.html" aria-label="ShopEasy Home">
                <h2>ShopEasy</h2>
            </a>
        </div>

        <nav aria-label="Main navigation">
            <ul>
                <li>
                    <a href="index.html">Home</a>
                </li>

                <li>
                    <a href="profile.html">Profile</a>
                </li>

                <li>
                    <a href="orders.html">Orders</a>
                </li>

                <li>
                    <a href="cart.html">Cart</a>
                </li>
            </ul>
        </nav>
    </header>

    <main>

        <section
            class="rating-page"
            aria-labelledby="rating-title"
        >

            <h1 id="rating-title">
                ⭐ Product Rating & Reviews
            </h1>

            <div class="rating-box">

                <h2>
                    Wireless Headphones
                </h2>

                <img
                    src="images/product1.jpg"
                    alt="Wireless Headphones"
                >

                <h3>
                    Give Your Rating
                </h3>

                <div
                    class="stars"
                    role="radiogroup"
                    aria-label="Product rating"
                >
                    <span
                        data-star="1"
                        role="radio"
                        aria-label="1 star"
                        tabindex="0"
                    >
                        ⭐
                    </span>

                    <span
                        data-star="2"
                        role="radio"
                        aria-label="2 stars"
                        tabindex="0"
                    >
                        ⭐
                    </span>

                    <span
                        data-star="3"
                        role="radio"
                        aria-label="3 stars"
                        tabindex="0"
                    >
                        ⭐
                    </span>

                    <span
                        data-star="4"
                        role="radio"
                        aria-label="4 stars"
                        tabindex="0"
                    >
                        ⭐
                    </span>

                    <span
                        data-star="5"
                        role="radio"
                        aria-label="5 stars"
                        tabindex="0"
                    >
                        ⭐
                    </span>
                </div>

                <textarea
                    id="reviewText"
                    name="review"
                    placeholder="Write your review..."
                    aria-label="Write your product review"
                ></textarea>

                <button
                    type="button"
                    id="submitReview"
                    class="btn"
                >
                    Submit Review
                </button>

            </div>
        </section>

        <section
            class="reviews-section"
            aria-labelledby="reviews-title"
        >

            <h2 id="reviews-title">
                Customer Reviews
            </h2>

            <div id="reviewsList"></div>

        </section>

    </main>

    <footer>
        <p>
            © 2026 ShopEasy. All Rights Reserved.
        </p>
    </footer>

    <script src="js/script.js"></script>

</body>

</html>
