<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="Login to your ShopEasy account."
    >

    <title>Login - ShopEasy</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <div class="logo">
            <a href="index.html" aria-label="ShopEasy Home">
                <h2>ShopEasy</h2>
            </a>
        </div>

        <nav aria-label="Main navigation">
            <ul>
                <li>
                    <a href="index.html">Home</a>
                </li>

                <li>
                    <a href="wishlist.html">Wishlist</a>
                </li>

                <li>
                    <a href="cart.html">Cart</a>
                </li>

                <li>
                    <a href="login.html" aria-current="page">Login</a>
                </li>
            </ul>
        </nav>

        <div class="icons">
            <a href="wishlist.html">
                ❤️ Wishlist
                (<span id="wishlist-count">0</span>)
            </a>

            <a href="cart.html">
                🛒 Cart
                (<span id="cart-count">0</span>)
            </a>
        </div>
    </header>

    <main>
        <section class="login-page" aria-labelledby="login-title">
            <div class="login-box">

                <h1 id="login-title">
                    Welcome Back
                </h1>

                <p>
                    Login to your ShopEasy account
                </p>

                <form id="loginForm">

                    <div class="input-box">
                        <label for="loginEmail">
                            Email Address
                        </label>

                        <input
                            type="email"
                            id="loginEmail"
                            name="email"
                            placeholder="Enter your email"
                            autocomplete="email"
                            required
                        >
                    </div>

                    <div class="input-box">
                        <label for="loginPassword">
                            Password
                        </label>

                        <input
                            type="password"
                            id="loginPassword"
                            name="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        >
                    </div>

                    <div class="login-options">
                        <label>
                            <input
                                type="checkbox"
                                name="remember"
                            >
                            Remember Me
                        </label>

                        <a href="forgot-password.html">
                            Forgot Password?
                        </a>
                    </div>

                    <button
                        type="submit"
                        class="btn"
                    >
                        Login
                    </button>

                    <p class="register-text">
                        Don't have an account?

                        <a href="register.html">
                            Create Account
                        </a>
                    </p>

                </form>
            </div>
        </section>
    </main>

    <footer>
        <p>
            © 2026 ShopEasy. All Rights Reserved.
        </p>
    </footer>

    <script src="js/script.js"></script>

</body>

</html>
